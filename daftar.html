<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="daftar">
    <header class="daftar">
        <div id="daftarakun">
        <hr><hr>
        <h1 >DAFTAR AKUN STORY ZOO</h1>
        <hr><hr>
        </div>
    </header>
    <main>
        <section class="secdaftar" >
            <form action="index_login.html">
                <input type="text" name="nama" id="nama" placeholder="masukkan username untuk nama pengguna anda" required><br>
                <input type="text" name="nleng" id="nleng" placeholder="masukkan nama lengkap anda" required><br>
                <input type="email" name="email" id="email" placeholder="masukkan alamat email anda contoh@gmail.com" required><br>
                <input type="text" name="hp" id="hp" placeholder="masukkan nomor telpon anda +62" required><br>
                <input type="password" name="katasan" id="katasan" placeholder="masukkan password dengan menggabungkan huruf dan angka" required><br>
                <button type="submit" id="back">Daftar</button>
            </form>
        </section>
    </main>

    <footer>
        <hr>
        <small>copyright &copy; 2026 puutrirahyu. All Rights Reserved.</small>
    </footer>
</body>

</html>
